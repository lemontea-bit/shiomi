<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%;height:100%">
  <sc-if value="{{ isSun }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;left:16%;top:16%;width:68%;height:68%;border-radius:50%;background:radial-gradient(circle at 34% 30%,#FFD9A0,#E9A85F 70%);box-shadow:0 0 10px rgba(233,168,95,.45)"></div>
  </sc-if>
  <sc-if value="{{ isP }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:44%;top:4%;width:46%;height:46%;border-radius:50%;background:radial-gradient(circle at 34% 30%,#FFD9A0,#E9A85F 70%);box-shadow:0 0 8px rgba(233,168,95,.4)"></div>
    <div style="position:absolute;left:2%;top:50%;width:44%;height:44%;border-radius:50%;background:#8FAAB6"></div>
    <div style="position:absolute;left:24%;top:34%;width:48%;height:48%;border-radius:50%;background:#B6CCD6"></div>
    <div style="position:absolute;left:4%;top:66%;width:78%;height:24%;border-radius:99px;background:#A2BAC4"></div>
  </sc-if>
  <sc-if value="{{ isC }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:2%;top:40%;width:44%;height:44%;border-radius:50%;background:#8FAAB6"></div>
    <div style="position:absolute;left:26%;top:20%;width:52%;height:52%;border-radius:50%;background:#B6CCD6"></div>
    <div style="position:absolute;left:54%;top:40%;width:40%;height:40%;border-radius:50%;background:#93AEBA"></div>
    <div style="position:absolute;left:4%;top:58%;width:90%;height:26%;border-radius:99px;background:#A2BAC4"></div>
  </sc-if>
  <sc-if value="{{ isR }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:2%;top:22%;width:42%;height:42%;border-radius:50%;background:#7A94A0"></div>
    <div style="position:absolute;left:26%;top:4%;width:50%;height:50%;border-radius:50%;background:#9FB6C0"></div>
    <div style="position:absolute;left:4%;top:40%;width:90%;height:24%;border-radius:99px;background:#8CA5B0"></div>
    <div style="position:absolute;left:22%;top:70%;width:7%;height:26%;border-radius:99px;background:#6FA8D6"></div>
    <div style="position:absolute;left:46%;top:74%;width:7%;height:26%;border-radius:99px;background:#6FA8D6"></div>
    <div style="position:absolute;left:70%;top:70%;width:7%;height:26%;border-radius:99px;background:#6FA8D6"></div>
  </sc-if>
  <sc-if value="{{ isS }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:2%;top:18%;width:42%;height:42%;border-radius:50%;background:#5F7683"></div>
    <div style="position:absolute;left:26%;top:2%;width:50%;height:50%;border-radius:50%;background:#7E96A3"></div>
    <div style="position:absolute;left:4%;top:36%;width:90%;height:24%;border-radius:99px;background:#6C8492"></div>
    <div style="position:absolute;left:40%;top:62%;width:24%;height:24%;background:#E9A85F;transform:rotate(45deg)"></div>
    <div style="position:absolute;left:20%;top:76%;width:7%;height:22%;border-radius:99px;background:#6FA8D6"></div>
    <div style="position:absolute;left:72%;top:76%;width:7%;height:22%;border-radius:99px;background:#6FA8D6"></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:48,&quot;height&quot;:48},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sun&quot;,&quot;pcloud&quot;,&quot;cloud&quot;,&quot;rain&quot;,&quot;storm&quot;],&quot;default&quot;:&quot;sun&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind || 'sun';
    return { isSun: k === 'sun', isP: k === 'pcloud', isC: k === 'cloud', isR: k === 'rain', isS: k === 'storm' };
  }
}
</script>
</body>
</html>
